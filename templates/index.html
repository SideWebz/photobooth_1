<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Photo Booth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <div class="photobooth">
      <div class="camera-layer" id="cameraLayer">
        <img id="cameraFeed" class="camera-feed" alt="Live camera feed" />
        <div class="flash" id="flash"></div>
      </div>

      <div class="hud">
        <div class="progress" id="progress" aria-live="polite">
          <span class="dot active"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>

      <div class="print-screen" id="printScreen" aria-live="polite">
        <div class="print-title">FOTO'S PRINTEN</div>
        <div class="print-countdown" id="printCountdown">10</div>
      </div>

      <div class="overlay" id="uiOverlay">
        <div class="start-message" id="startMessage">KLIK OM<br />FOTO TE NEMEN</div>
        <div class="countdown" id="countdown" aria-live="polite"></div>
        <div class="status" id="statusText">EVEN GEDULD...</div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
